        function GuideDetailModal({ guide, onClose, lang, role, onEditGuide }) {
            if (!guide) return null;

            const renderMedia = () => {
                if (!guide.img) return null;
                const str = String(guide.img).trim();

                // YouTube / Vimeo Embed Support
                if (str.includes('youtube.com/watch') || str.includes('youtu.be/') || str.includes('youtube.com/embed/')) {
                    let embedUrl = str;
                    if (str.includes('youtube.com/watch?v=')) {
                        const videoId = str.split('v=')[1]?.split('&')[0];
                        embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    } else if (str.includes('youtu.be/')) {
                        const videoId = str.split('youtu.be/')[1]?.split('?')[0];
                        embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    }
                    return (
                        <iframe 
                            src={embedUrl} 
                            title={guide.title_th} 
                            className="w-full h-72 sm:h-96 rounded-2xl border-0 shadow-inner" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowFullScreen
                        />
                    );
                }

                const isVideo = str.startsWith('data:video') || 
                                str.startsWith('blob:') || 
                                str.includes('video') || 
                                /\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(str);

                if (isVideo) {
                    return (
                        <video 
                            src={str} 
                            controls 
                            autoPlay 
                            playsInline 
                            controlsList="nodownload"
                            className="w-full max-h-96 object-contain rounded-2xl shadow-inner bg-slate-950" 
                        />
                    );
                }

                return <img src={str} alt={guide.title_th} className="w-full max-h-96 object-contain" />;
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn" onClick={onClose}>
                    <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-2xl w-full p-6 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto custom-scrollbar" onClick={e => e.stopPropagation()}>
                        <div className="flex items-start justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
                            <div className="space-y-1 pr-4">
                                <span className="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-300">
                                    EMPEO & APP GUIDE
                                </span>
                                <h3 className="text-base sm:text-lg font-black text-slate-900 dark:text-slate-100 pt-1">
                                    {lang === 'th' ? guide.title_th : guide.title_mm}
                                </h3>
                            </div>
                            <div className="flex items-center space-x-2 shrink-0">
                                {role === 'admin' && (
                                    <button 
                                        onClick={() => { onClose(); onEditGuide(guide); }} 
                                        className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs rounded-xl shadow transition"
                                    >
                                        <i className="fa-solid fa-pen mr-1"></i>แก้ไขคู่มือนี้
                                    </button>
                                )}
                                <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:bg-slate-200 text-base flex items-center justify-center">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>

                        {guide.img && (
                            <div className="rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 bg-slate-950 flex items-center justify-center max-h-96">
                                {renderMedia()}
                            </div>
                        )}

                        <div className="p-4 bg-sky-50 dark:bg-slate-800/80 border border-sky-200/60 dark:border-slate-700 rounded-2xl space-y-1">
                            <span className="text-[10px] uppercase font-black text-sky-700 dark:text-sky-300 tracking-wider">คำอธิบายคู่มือ:</span>
                            <p className="text-xs sm:text-sm text-slate-700 dark:text-slate-200 font-light leading-relaxed">
                                {lang === 'th' ? guide.desc_th : guide.desc_mm}
                            </p>
                        </div>

                        <div className="space-y-3">
                            <h4 className="text-xs font-black uppercase tracking-wider text-slate-400 flex items-center space-x-1.5">
                                <i className="fa-solid fa-list-ol text-indigo-500"></i>
                                <span>ขั้นตอนการปฏิบัติงาน (Step-by-Step Instructions):</span>
                            </h4>

                            {guide.steps_th && guide.steps_th.length > 0 ? (
                                <ul className="space-y-2.5">

                            <button onClick={onAddNew} className="px-3.5 py-1.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl shadow transition">
                                {t.addNewBtn}
                            </button>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {guides.map((g) => (
                            <div key={g.id} onClick={() => onSelectGuide(g)} className="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:border-sky-500 transition cursor-pointer space-y-3 flex flex-col justify-between group">
                                <div className="space-y-2">
                                    {g.img && (g.img.startsWith('data:video') || g.img.endsWith('.mp4') || g.img.endsWith('.webm') || g.img.endsWith('.mov') || g.img.includes('video')) ? (
                                        <div className="relative w-full h-40 bg-slate-950 rounded-2xl overflow-hidden flex items-center justify-center">
                                            <video src={g.img} className="w-full h-40 object-cover opacity-80" />
                                            <div className="absolute inset-0 flex items-center justify-center bg-slate-950/30 group-hover:bg-slate-950/10 transition">
                                                <div className="w-12 h-12 rounded-full bg-sky-600/90 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                                                    <i className="fa-solid fa-play text-lg ml-1"></i>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <img src={g.img} alt={g.title_th} className="w-full h-40 object-cover rounded-2xl border border-slate-100 dark:border-slate-800" />

                                        {lang === 'th' ? g.title_th : g.title_mm}

                                    <p className="text-xs text-slate-500 dark:text-slate-400 font-light line-clamp-2">
                                        {lang === 'th' ? g.desc_th : g.desc_mm}

                                </div>

                                <div className="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800">
                                    <span className="text-xs font-bold text-sky-600">ดูขั้นตอนการใช้งาน <i className="fa-solid fa-arrow-right text-[10px] ml-1"></i></span>
                                    {role === 'admin' && (
                                        <div className="flex space-x-1" onClick={e => e.stopPropagation()}>
                                            <button onClick={() => onEdit(g)} className="px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 text-[10px] font-bold rounded-lg">{t.editBtn}</button>
                                            <button onClick={() => onDelete(g.id)} className="px-2.5 py-1 bg-rose-500 text-white text-[10px] font-bold rounded-lg">{t.deleteBtn}</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

        function FaqView({ lang, role, faqs, triggerToast, onEdit, onDelete, onAddNew, feedbacks, onAddFeedback, onDeleteFeedback }) {
            const t = I18N[lang];
            const [feedbackText, setFeedbackText] = useState('');

            const handleSubmitFeedback = (e) => {
                e.preventDefault();
                if (!feedbackText.trim()) return;
                onAddFeedback(feedbackText);
                setFeedbackText('');
                triggerToast("ส่งข้อเสนอแนะเรียบร้อยแล้ว ขอบคุณสำหรับความเห็นครับ");
            };

            return (
                <div className="space-y-6 animate-fadeIn">
                    <div className="flex items-center justify-between bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
                        <div>
                            <h2 className="text-xl sm:text-2xl font-black text-slate-900 dark:text-slate-100">คำถามพบบ่อย & ข้อเสนอแนะถึง HR</h2>
                            <p className="text-xs text-slate-400 font-medium">คำตอบสำหรับข้อสงสัยทั่วไป และกล่องรับฟังความคิดเห็นจากพนักงาน</p>
                        </div>
                        {role === 'admin' && (
                            <button onClick={onAddNew} className="px-3.5 py-1.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl shadow transition">
                                {t.addNewBtn}
                            </button>
                        )}
                    </div>

                    <div className="space-y-3">
                        {faqs.map((f) => (
                            <div key={f.id} className="p-5 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-2">
                                <div className="flex items-center justify-between">
                                    <span className="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                                        {f.category}
                                    </span>
                                    {role === 'admin' && (
                                        <div className="flex space-x-1">
                                            <button onClick={() => onEdit(f)} className="px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-slate-800 text-[10px] font-bold rounded-lg">{t.editBtn}</button>
                                            <button onClick={() => onDelete(f.id)} className="px-2.5 py-1 bg-rose-500 text-white text-[10px] font-bold rounded-lg">{t.deleteBtn}</button>
                                        </div>
                                    )}
                                </div>
                                <h4 className="font-extrabold text-sm text-slate-900 dark:text-slate-100">
                                    {lang === 'th' ? f.q_th : f.q_mm}
                                </h4>
                                <p className="text-xs text-slate-600 dark:text-slate-400 font-light leading-relaxed">
                                    {lang === 'th' ? f.a_th : f.a_mm}
                                </p>
                            </div>
                        ))}
                    </div>

                    <div className="p-6 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-4">
                        <div className="space-y-1">
                            <h3 className="font-extrabold text-base text-slate-900 dark:text-slate-100 flex items-center space-x-2">
                                <i className="fa-solid fa-comments text-amber-500"></i>
                                <span>HR Suggestion & Feedback Box (กล่องรับข้อเสนอแนะถึง HR)</span>
                            </h3>
                            <p className="text-xs text-slate-400">ร่วมแสดงความคิดเห็นหรือเสนอแนะข้อปรับปรุง เพื่อให้ Value Sourcing เป็นบ้านที่น่าอยู่ร่วมกัน</p>
                        </div>

                        <form onSubmit={handleSubmitFeedback} className="space-y-3">
                            <textarea
                                value={feedbackText}
                                onChange={(e) => setFeedbackText(e.target.value)}
                                rows="4"
                                placeholder="พิมพ์ข้อเสนอแนะหรือข้อสอบถามตรงถึงฝ่ายบริหารทรัพยากรบุคคล..."
                                className="w-full p-4 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-sky-500 text-slate-800 dark:text-slate-100"
                            ></textarea>
                            <button type="submit" className="px-5 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-extrabold text-xs rounded-xl shadow transition">
                                ส่งข้อเสนอแนะถึง HR
                            </button>
                        </form>

                        {role === 'admin' && (
                            <div className="pt-4 border-t border-slate-100 dark:border-slate-800 space-y-3">
                                <div className="flex items-center justify-between">
                                    <h4 className="font-extrabold text-xs text-amber-600 dark:text-amber-400 uppercase tracking-wider flex items-center space-x-1.5">
                                        <i className="fa-solid fa-inbox"></i>
                                        <span>กล่องข้อความข้อเสนอแนะสำหรับแอดมิน ({feedbacks ? feedbacks.length : 0} รายการ)</span>
                                    </h4>
                                </div>

                                {feedbacks && feedbacks.length > 0 ? (
                                    <div className="space-y-2 max-h-60 overflow-y-auto custom-scrollbar">
                                        {feedbacks.map((fb) => (
                                            <div key={fb.id} className="p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl border border-slate-200 dark:border-slate-700 flex items-start justify-between gap-3 text-xs">
                                                <div className="space-y-1">
                                                    <span className="text-[10px] text-slate-400">{fb.date}</span>
                                                    <p className="text-slate-800 dark:text-slate-200 font-light leading-relaxed">{fb.text}</p>
                                                </div>
                                                <button onClick={() => onDeleteFeedback(fb.id)} className="text-rose-500 hover:text-rose-600 text-xs shrink-0">
                                                    <i className="fa-solid fa-trash"></i>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <p className="text-xs text-slate-400 italic">ยังไม่มีข้อเสนอแนะส่งเข้ามาในขณะนี้</p>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function AdminCRUDModal({ lang, type, data, chapterId, sectionIndex, onClose, onSave }) {
            const t = I18N[lang];
            const [formData, setFormData] = useState(() => {
                if (data) {
                    return {
                        ...data,
                        details_th: data.details_th && data.details_th.length > 0 ? [...data.details_th] : [''],
                        items: data.items && data.items.length > 0 ? data.items.map(it => (typeof it === 'object' ? { ...it } : it)) : [''],
                        probation_items_th: data.probation_items_th && data.probation_items_th.length > 0 ? [...data.probation_items_th] : [''],
                        perm_items_th: data.perm_items_th && data.perm_items_th.length > 0 ? [...data.perm_items_th] : [''],
                        bonus_items_th: data.bonus_items_th && data.bonus_items_th.length > 0 ? [...data.bonus_items_th] : [''],
                        adjust_items_th: data.adjust_items_th && data.adjust_items_th.length > 0 ? [...data.adjust_items_th] : [''],
                        steps_th: data.steps_th && data.steps_th.length > 0 ? [...data.steps_th] : ['']
                    };
                }
                return { 
                    chapterId, 
                    sectionIndex,
                    details_th: [''],
                    items: [''],
                    probation_items_th: [''],
                    perm_items_th: [''],
                    bonus_items_th: [''],
                    adjust_items_th: [''],
                    steps_th: ['']
                };
            });

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.type.startsWith('video/')) {
                        if (file.size > 100 * 1024 * 1024) {
                            alert("ไฟล์วิดีโอมีขนาดใหญ่เกินไป (มากกว่า 100MB) กรุณาใช้ไฟล์วิดีโอที่มีขนาดเล็กลง หรือใช้วิธีวางลิงก์ URL แทน");
                            return;
                        }
                        // Use instant object URL for video streaming playback
                        const blobUrl = URL.createObjectURL(file);
                        setFormData(prev => ({ ...prev, img: blobUrl }));
                        return;
                    }

                    if (file.size > 3 * 1024 * 1024) {
                        alert("ไฟล์รูปภาพมีขนาดใหญ่เกินไป (มากกว่า 3MB) กรุณาใช้ไฟล์ขนาดไม่เกิน 3MB หรือใช้วิธีวางลิงก์ URL แทน");
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData(prev => ({ ...prev, img: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleArrayChange = (field, index, value) => {
                setFormData(prev => {
                    const list = [...(prev[field] || [])];
                    list[index] = value;
                    return { ...prev, [field]: list };
                });
            };

            const handleAddArrayItem = (field, defaultValue = '') => {
                setFormData(prev => ({
                    ...prev,
                    [field]: [...(prev[field] || []), defaultValue]
                }));
            };

            const handleRemoveArrayItem = (field, index) => {
                setFormData(prev => {
                    const list = [...(prev[field] || [])];
                    list.splice(index, 1);
                    return { ...prev, [field]: list };
                });
            };

            const handleObjectArrayChange = (field, index, propKey, value) => {
                setFormData(prev => {
                    const list = [...(prev[field] || [])];
                    list[index] = { ...list[index], [propKey]: value };
                    return { ...prev, [field]: list };
                });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const updated = { ...formData };

                const cleanStringArray = (arr) => Array.isArray(arr) ? arr.map(s => (typeof s === 'string' ? s.trim() : s)).filter(Boolean) : [];

                if (type === 'section') {
                    updated.details_th = cleanStringArray(updated.details_th);
                }
                if (type === 'pillar') {
                    updated.items = cleanStringArray(updated.items);
                }
                if (type === 'empeoGuide') {
                    updated.steps_th = cleanStringArray(updated.steps_th);
                }
                if (type === 'benefit') {
                    if (updated.probation_items_th) updated.probation_items_th = cleanStringArray(updated.probation_items_th);
                    if (updated.perm_items_th) updated.perm_items_th = cleanStringArray(updated.perm_items_th);
                    if (updated.bonus_items_th) updated.bonus_items_th = cleanStringArray(updated.bonus_items_th);
                    if (updated.adjust_items_th) updated.adjust_items_th = cleanStringArray(updated.adjust_items_th);
                    if (updated.key === 'facilities') updated.items = cleanStringArray(updated.items);
                }

                onSave(updated, chapterId, sectionIndex);
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn" onClick={onClose}>
                    <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-xl w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4 max-h-[88vh] overflow-y-auto custom-scrollbar" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                            <h3 className="font-extrabold text-base text-slate-900 dark:text-slate-100">
                                {data ? 'แก้ไขข้อมูล (แยกช่องแก้ไข)' : 'เพิ่มข้อมูลใหม่'} ({type})
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl"><i className="fa-solid fa-xmark"></i></button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                            {type === 'benefit' && (
                                <div className="space-y-4">
                                    {formData.title_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">หัวข้อหลัก (Title):</label>
                                            <input type="text" value={formData.title_th || ''} onChange={e => setFormData({ ...formData, title_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" required />
                                        </div>
                                    )}

                                    {formData.daily_title_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">หัวข้อกลุ่มรายวัน:</label>
                                            <input type="text" value={formData.daily_title_th || ''} onChange={e => setFormData({ ...formData, daily_title_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                        </div>
                                    )}

                                    {formData.daily_round1_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">รอบจ่ายพนักงานรายวัน รอบที่ 1:</label>
                                            <input type="text" value={formData.daily_round1_th || ''} onChange={e => setFormData({ ...formData, daily_round1_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                        </div>
                                    )}

                                    {formData.daily_round2_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">รอบจ่ายพนักงานรายวัน รอบที่ 2:</label>
                                            <input type="text" value={formData.daily_round2_th || ''} onChange={e => setFormData({ ...formData, daily_round2_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                        </div>
                                    )}

                                    {formData.monthly_title_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">หัวข้อกลุ่มรายเดือน:</label>
                                            <input type="text" value={formData.monthly_title_th || ''} onChange={e => setFormData({ ...formData, monthly_title_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                        </div>
                                    )}

                                    {formData.monthly_round_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">รอบจ่ายพนักงานรายเดือน:</label>
                                            <input type="text" value={formData.monthly_round_th || ''} onChange={e => setFormData({ ...formData, monthly_round_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                        </div>
                                    )}

                                    {formData.bank_note_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">ข้อความช่องทางจ่ายค่าจ้าง (SCB):</label>
                                            <input type="text" value={formData.bank_note_th || ''} onChange={e => setFormData({ ...formData, bank_note_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                        </div>
                                    )}

                                    {formData.strict_rule_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">ข้อบังคับวินัยร้ายแรงเรื่องเงินเดือน:</label>
                                            <input type="text" value={formData.strict_rule_th || ''} onChange={e => setFormData({ ...formData, strict_rule_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                        </div>
                                    )}

                                    {formData.probation_title_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">หัวข้อช่วงทดลองงาน:</label>
                                            <input type="text" value={formData.probation_title_th || ''} onChange={e => setFormData({ ...formData, probation_title_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                        </div>
                                    )}

                                    {formData.probation_items_th !== undefined && (
                                        <div className="space-y-2">
                                            <div className="flex items-center justify-between">
                                                <label className="font-bold text-slate-700 dark:text-slate-300">รายการสวัสดิการช่วงทดลองงาน:</label>
                                                <button type="button" onClick={() => handleAddArrayItem('probation_items_th')} className="px-2.5 py-1 bg-sky-600 text-white rounded-lg text-[11px] font-bold">+ เพิ่มรายการ</button>
                                            </div>
                                            {(formData.probation_items_th || []).map((item, idx) => (
                                                <div key={idx} className="flex items-center space-x-2">
                                                    <span className="text-slate-400 font-bold shrink-0">{idx + 1}.</span>
                                                    <input type="text" value={item} onChange={e => handleArrayChange('probation_items_th', idx, e.target.value)} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" placeholder="รายละเอียดสวัสดิการ..." />
                                                    <button type="button" onClick={() => handleRemoveArrayItem('probation_items_th', idx)} className="p-2 text-rose-500 hover:text-rose-600 shrink-0"><i className="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {formData.perm_title_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">หัวข้อพนักงานประจำ:</label>
                                            <input type="text" value={formData.perm_title_th || ''} onChange={e => setFormData({ ...formData, perm_title_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                        </div>
                                    )}

                                    {formData.perm_items_th !== undefined && (
                                        <div className="space-y-2">
                                            <div className="flex items-center justify-between">
                                                <label className="font-bold text-slate-700 dark:text-slate-300">รายการสวัสดิการพนักงานประจำ:</label>
                                                <button type="button" onClick={() => handleAddArrayItem('perm_items_th')} className="px-2.5 py-1 bg-sky-600 text-white rounded-lg text-[11px] font-bold">+ เพิ่มรายการ</button>
                                            </div>
                                            {(formData.perm_items_th || []).map((item, idx) => (
                                                <div key={idx} className="flex items-center space-x-2">
                                                    <span className="text-slate-400 font-bold shrink-0">{idx + 1}.</span>
                                                    <input type="text" value={item} onChange={e => handleArrayChange('perm_items_th', idx, e.target.value)} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" placeholder="รายละเอียดสวัสดิการ..." />
                                                    <button type="button" onClick={() => handleRemoveArrayItem('perm_items_th', idx)} className="p-2 text-rose-500 hover:text-rose-600 shrink-0"><i className="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {formData.bonus_title_th !== undefined && (
                                        <div>
                                            <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">หัวข้อโบนัสประจำปี:</label>
                                            <input type="text" value={formData.bonus_title_th || ''} onChange={e => setFormData({ ...formData, bonus_title_th: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                        </div>
                                    )}

                                    {formData.bonus_items_th !== undefined && (
                                        <div className="space-y-2">

                            {type === 'executive' && (

                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">ตำแหน่ง (Title):</label>

                                    <div>

                            {type === 'hr' && (

                                        <input type="text" value={formData.name || ''} onChange={e => setFormData({ ...formData, name: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" required />

                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">Line ID:</label>
                                        <input type="text" value={formData.line || ''} onChange={e => setFormData({ ...formData, line: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />

                                    <div>
                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">อีเมล (Email):</label>
                                        <input type="email" value={formData.email || ''} onChange={e => setFormData({ ...formData, email: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">อัปโหลดรูปโปรไฟล์จากเครื่องคอมพิวเตอร์:</label>
                                        <input type="file" accept="image/*" onChange={handleFileUpload} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs" />
                                    </div>
                                    {formData.img && (

                                        </div>
                                    )}

                            )}

                            {type === 'empeoGuide' && (
                                <>
                                    <div>
                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">ชื่อคู่มือ (Title):</label>
                                        <input type="text" value={formData.title_th || ''} onChange={e => setFormData({ ...formData, title_th: e.target.value, title_mm: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" required />
                                    </div>
                                    <div>
                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">คำอธิบายย่อ (Description):</label>
                                        <input type="text" value={formData.desc_th || ''} onChange={e => setFormData({ ...formData, desc_th: e.target.value, desc_mm: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">อัปโหลดสื่อการสอนจากคอมพิวเตอร์ (รูปภาพ หรือ ไฟล์วิดีโอ MP4 / MOV):</label>
                                        <input type="file" accept="image/*,video/*" onChange={handleFileUpload} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs" />
                                    </div>
                                    <div>
                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">หรือวางลิงก์ URL วิดีโอ / YouTube / รูปภาพ:</label>
                                        <input type="text" value={formData.img || ''} onChange={e => setFormData({ ...formData, img: e.target.value })} placeholder="https://www.youtube.com/watch?v=... หรือ https://..." className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl text-xs" />
                                    </div>
                                    {formData.img && (formData.img.startsWith('data:video') || formData.img.startsWith('blob:') || formData.img.endsWith('.mp4') || formData.img.endsWith('.webm') || formData.img.endsWith('.mov') || formData.img.includes('video') || formData.img.includes('youtube.com') || formData.img.includes('youtu.be')) ? (
                                        <div className="pt-1 space-y-1">
                                            <span className="text-[10px] text-emerald-600 font-bold block">✓ พรีวิวตัวเล่นวิดีโอสื่อการสอน:</span>
                                            {formData.img.includes('youtube.com') || formData.img.includes('youtu.be') ? (
                                                <div className="p-3 bg-slate-950 text-white rounded-xl text-center text-xs">
                                                    <i className="fa-brands fa-youtube text-red-500 text-lg mr-2"></i>
                                                    <span>ตรวจพบลิงก์ YouTube (ระบบจะแสดงผลเป็นตัวเล่น YouTube ในหน้าคู่มือ)</span>
                                                </div>
                                            ) : (
                                                <video src={formData.img} controls className="w-full h-44 object-contain bg-slate-950 rounded-xl border" />
                                            )}
                                        </div>
                                    ) : formData.img ? (
                                        <div className="pt-1 flex items-center space-x-3">
                                            <img src={formData.img} alt="Preview" className="w-16 h-16 rounded-xl object-cover border" />
                                            <span className="text-[10px] text-slate-400">ภาพตัวอย่างที่เลือก</span>
                                        </div>
                                    ) : null}
                                    <div className="space-y-2 pt-2">
                                        <div className="flex items-center justify-between">
                                            <label className="font-bold text-slate-700 dark:text-slate-300">ขั้นตอนการใช้งาน (แยกข้อ):</label>
                                            <button type="button" onClick={() => handleAddArrayItem('steps_th')} className="px-2.5 py-1 bg-sky-600 text-white rounded-lg text-[11px] font-bold">+ เพิ่มขั้นตอน</button>
                                        </div>
                                        {(formData.steps_th || []).map((step, idx) => (
                                            <div key={idx} className="flex items-center space-x-2">
                                                <span className="text-slate-400 font-bold shrink-0">{idx + 1}.</span>
                                                <input type="text" value={step} onChange={e => handleArrayChange('steps_th', idx, e.target.value)} className="w-full p-2 bg-slate-50 dark:bg-slate-800 border rounded-xl" placeholder="ขั้นตอนการทำงาน..." />
                                                <button type="button" onClick={() => handleRemoveArrayItem('steps_th', idx)} className="p-2 text-rose-500 hover:text-rose-600 shrink-0"><i className="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}

                            {type === 'faq' && (
                                <>
                                    <div>
                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">หมวดหมู่คำถาม (Category):</label>
                                        <input type="text" value={formData.category || ''} onChange={e => setFormData({ ...formData, category: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" required />
                                    </div>
                                    <div>
                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">คำถาม (Question):</label>
                                        <input type="text" value={formData.q_th || ''} onChange={e => setFormData({ ...formData, q_th: e.target.value, q_mm: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" required />
                                    </div>
                                    <div>
                                        <label className="font-bold block mb-1 text-slate-700 dark:text-slate-300">คำตอบ (Answer):</label>
                                        <textarea rows="3" value={formData.a_th || ''} onChange={e => setFormData({ ...formData, a_th: e.target.value, a_mm: e.target.value })} className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl" required />
                                    </div>
                                </>
                            )}

                            <div className="flex justify-end space-x-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold rounded-xl">{t.cancelBtn}</button>
                                <button type="submit" className="px-5 py-2 bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold rounded-xl shadow">{t.saveBtn}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function App() {
            const [lang, setLang] = useState('th');
            const [theme, setTheme] = useState('light');
            const [role, setRole] = useState('employee');
            const [activeTab, setActiveTab] = useState('home');

            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [theme]);

            const [showAdminPinModal, setShowAdminPinModal] = useState(false);
            const [adminPinInput, setAdminPinInput] = useState('');
            const [adminPinError, setAdminPinError] = useState('');

            const [searchQuery, setSearchQuery] = useState('');
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const [toastMsg, setToastMsg] = useState('');

            const [selectedAnnouncement, setSelectedAnnouncement] = useState(null);
            const [selectedProfile, setSelectedProfile] = useState(null);
            const [selectedOrgLevel, setSelectedOrgLevel] = useState(null);
            const [selectedHandbookSection, setSelectedHandbookSection] = useState(null);
            const [selectedGuide, setSelectedGuide] = useState(null);

            const [crudModal, setCrudModal] = useState({ isOpen: false, type: null, data: null, chapterId: null, sectionIndex: null });

            const triggerToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            const [announcements, setAnnouncements] = useState(() => {
                const saved = localStorage.getItem('vsc_announcements_v2');
                return saved ? JSON.parse(saved) : INITIAL_ANNOUNCEMENTS;
            });

            const [companyInfo, setCompanyInfo] = useState(() => {
                const saved = localStorage.getItem('vsc_company_info_v2');
                return saved ? JSON.parse(saved) : INITIAL_COMPANY_INFO;
            });

            const [handbookData, setHandbookData] = useState(() => {
                const saved = localStorage.getItem('vsc_handbook_data_v2');
                return saved ? JSON.parse(saved) : INITIAL_HANDBOOK_CHAPTERS;
            });

            const [executives, setExecutives] = useState(() => {
                const saved = localStorage.getItem('vsc_executives_v2');
                return saved ? JSON.parse(saved) : INITIAL_EXECUTIVES;
            });

            const [hrTeam, setHrTeam] = useState(() => {
                const saved = localStorage.getItem('vsc_hr_team_v2');
                return saved ? JSON.parse(saved) : INITIAL_HR_TEAM;
            });

            const [empeoGuides, setEmpeoGuides] = useState(() => {
                const saved = localStorage.getItem('vsc_empeo_guides_v2');
                return saved ? JSON.parse(saved) : INITIAL_EMPEO_GUIDES;
            });

            const [faqs, setFaqs] = useState(() => {
                const saved = localStorage.getItem('vsc_faqs_v2');
                return saved ? JSON.parse(saved) : INITIAL_FAQS;
            });

            const [feedbacks, setFeedbacks] = useState(() => {
                const saved = localStorage.getItem('vsc_feedbacks_v2');
                return saved ? JSON.parse(saved) : [];
            });

            const [warRoomReports, setWarRoomReports] = useState(() => {
                const saved = localStorage.getItem('vsc_warroom_v2');
                return saved ? JSON.parse(saved) : INITIAL_WARROOM_REPORTS;
            });

            const [benefitsData, setBenefitsData] = useState(() => {
                const saved = localStorage.getItem('vsc_benefits_v2');
                return saved ? JSON.parse(saved) : INITIAL_BENEFITS_DATA;
            });

            const [orgLevels, setOrgLevels] = useState(() => {
                const saved = localStorage.getItem('vsc_org_levels_v2');
                return saved ? JSON.parse(saved) : INITIAL_ORG_LEVELS;
            });

            // Safe localStorage writer to catch QuotaExceededError gracefully
            const safeSetLocalStorage = (key, data) => {
                try {
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (err) {
                    console.warn(`[LocalStorage Quota Warning] Could not save '${key}':`, err);
                }
            };

            useEffect(() => { safeSetLocalStorage('vsc_handbook_data_v2', handbookData); }, [handbookData]);
            useEffect(() => { safeSetLocalStorage('vsc_announcements_v2', announcements); }, [announcements]);
            useEffect(() => { safeSetLocalStorage('vsc_executives_v2', executives); }, [executives]);
            useEffect(() => { safeSetLocalStorage('vsc_hr_team_v2', hrTeam); }, [hrTeam]);
            useEffect(() => { safeSetLocalStorage('vsc_warroom_v2', warRoomReports); }, [warRoomReports]);
            useEffect(() => { safeSetLocalStorage('vsc_org_levels_v2', orgLevels); }, [orgLevels]);
            useEffect(() => { safeSetLocalStorage('vsc_company_info_v2', companyInfo); }, [companyInfo]);
            useEffect(() => { safeSetLocalStorage('vsc_benefits_v2', benefitsData); }, [benefitsData]);
            useEffect(() => { safeSetLocalStorage('vsc_empeo_guides_v2', empeoGuides); }, [empeoGuides]);
            useEffect(() => { safeSetLocalStorage('vsc_faqs_v2', faqs); }, [faqs]);
            useEffect(() => { safeSetLocalStorage('vsc_feedbacks_v2', feedbacks); }, [feedbacks]);

            const handleUpdateOrgLevelPositions = (levelCode, newPositions) => {
                setOrgLevels(prev => prev.map(l => l.level === levelCode ? { ...l, positions: newPositions } : l));
                setSelectedOrgLevel(prev => prev && prev.level === levelCode ? { ...prev, positions: newPositions } : prev);
                triggerToast(I18N[lang].toastSaved);
            };

            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');
            const toggleLang = () => setLang(prev => prev === 'th' ? 'mm' : 'th');

            const handleToggleRole = () => {
                if (role === 'admin') {
                    setRole('employee');
                    triggerToast(I18N[lang].toastAdminOff);
                } else {
                    setAdminPinInput('');
                    setAdminPinError('');
                    setShowAdminPinModal(true);
                }
            };

            const handleVerifyAdminPin = (e) => {
                e.preventDefault();
                if (adminPinInput === '123456') {
                    setRole('admin');
                    setShowAdminPinModal(false);
                    triggerToast(I18N[lang].toastAdminOn);
                } else {
                    setAdminPinError('รหัสผ่านไม่ถูกต้อง (กรุณากรอก 123456)');
                }
            };

            const handleSaveCRUD = (formData, targetChapterId, targetSectionIndex) => {
                const { type } = crudModal;
                const chapterId = targetChapterId || crudModal.chapterId;
                const sectionIndex = targetSectionIndex !== undefined ? targetSectionIndex : crudModal.sectionIndex;

                if (type === 'announcement') {
                    if (formData.id) {
                        setAnnouncements(prev => prev.map(a => a.id === formData.id ? { ...a, ...formData } : a));
                    } else {
                        const newAnn = {
                            id: "ann-" + Date.now(),
                            category: formData.category || "HR Policy",
                            date: formData.date || new Date().toLocaleDateString('th-TH'),
                            title_th: formData.title_th || "ประกาศใหม่",
                            title_mm: formData.title_mm || formData.title_th || "ประกาศใหม่",
                            desc_th: formData.desc_th || "",
                            desc_mm: formData.desc_mm || formData.desc_th || "",
                            detail_th: formData.detail_th || formData.desc_th || ""
                        };
                        setAnnouncements(prev => [newAnn, ...prev]);
                    }
                } else if (type === 'warRoom') {
                    if (formData.id) {
                        setWarRoomReports(prev => prev.map(r => r.id === formData.id ? { ...r, ...formData } : r));
                    } else {
                        const newReport = {
                            id: "wr-" + Date.now(),
                            period: formData.period || "สิงหาคม 2569",
                            title: formData.title || "รายงานสถานการณ์ VSC",
                            author: "Executive Team",
                            summary: formData.summary || "",
                            pillars: formData.pillars || INITIAL_WARROOM_REPORTS[0].pillars
                        };
                        setWarRoomReports(prev => [newReport, ...prev]);
                    }
                } else if (type === 'pillar') {
                    setWarRoomReports(prev => prev.map(r => {
                        const pillars = (r.pillars || []).map(p => p.id === formData.id ? { ...p, ...formData } : p);
                        return { ...r, pillars };
                    }));
                } else if (type === 'chapter') {
                    if (formData.id) {
                        setHandbookData(prev => prev.map(ch => ch.id === formData.id ? { ...ch, ...formData } : ch));
                    } else {
                        const newCh = {
                            id: "ch-" + Date.now(),
                            title_th: formData.title_th || "หมวดหมู่ใหม่",
                            title_mm: formData.title_mm || formData.title_th || "หมวดหมู่ใหม่",
                            icon: formData.icon || "fa-bookmark",
                            sections: []
                        };
                        setHandbookData(prev => [...prev, newCh]);
                    }
                } else if (type === 'section') {
                    setHandbookData(prev => prev.map(ch => {
                        if (ch.id === chapterId || (!chapterId && ch.sections && ch.sections.some(s => s.subTitle_th === formData.subTitle_th))) {
                            const secs = [...(ch.sections || [])];
                            const newSec = {
                                badge: formData.badge || "ข้อปฏิบัติ",
                                subTitle_th: formData.subTitle_th || "หัวข้อระเบียบปฏิบัติ",
                                subTitle_mm: formData.subTitle_mm || formData.subTitle_th,
                                summary_th: formData.summary_th || "",
                                summary_mm: formData.summary_mm || formData.summary_th || "",
                                details_th: formData.details_th || []
                            };

                            if (sectionIndex !== null && sectionIndex !== undefined && sectionIndex >= 0) {
                                secs[sectionIndex] = newSec;
                            } else {
                                secs.push(newSec);
                            }
                            return { ...ch, sections: secs };
                        }
                        return ch;
                    }));

                    if (selectedHandbookSection) {
                        setSelectedHandbookSection(prev => ({
                            ...prev,
                            badge: formData.badge,
                            subTitle_th: formData.subTitle_th,
                            summary_th: formData.summary_th,
                            details_th: formData.details_th
                        }));
                    }
                } else if (type === 'executive') {
                    if (formData.id) {
                        setExecutives(prev => prev.map(e => e.id === formData.id ? { ...e, ...formData } : e));
                    } else {
                        const newEx = {
                            id: "ex-" + Date.now(),
                            name: formData.name || "ชื่อผู้บริหาร",
                            title_th: formData.title_th || "ตำแหน่ง",
                            title_mm: formData.title_mm || formData.title_th,
                            email: formData.email || "exec@valuesourcing.co.th",
                            dept: "Executive Board",
                            bio_th: formData.bio_th || "",
                            quote_th: formData.quote_th || "",
                            img: formData.img || "https://placehold.co/150x150/0284c7/ffffff?text=Executive"
                        };
                        setExecutives(prev => [...prev, newEx]);
                    }
                } else if (type === 'hr') {
                    if (formData.id) {
                        setHrTeam(prev => prev.map(h => h.id === formData.id ? { ...h, ...formData } : h));
                    } else {
                        const newHr = {
                            id: "hr-" + Date.now(),
                            name: formData.name || "ชื่อเจ้าหน้าที่ HR",
                            title_th: formData.title_th || "ตำแหน่ง HR",
                            title_mm: formData.title_mm || formData.title_th,
                            phone: formData.phone || "02-123-4500",
                            line: formData.line || "@vsc_hr",
                            email: formData.email || "hr@valuesourcing.co.th",
                            dept: "People Operations Team",
                            role_th: formData.role_th || "",
                            img: formData.img || "https://placehold.co/150x150/8b5cf6/ffffff?text=HR"
                        };
                        setHrTeam(prev => [...prev, newHr]);
                    }
                } else if (type === 'empeoGuide') {
                    if (formData.id) {
                        setEmpeoGuides(prev => prev.map(g => g.id === formData.id ? { ...g, ...formData } : g));
                        if (selectedGuide && selectedGuide.id === formData.id) {
                            setSelectedGuide(prev => ({ ...prev, ...formData }));
                        }
                    } else {
                        const newG = {
                            id: "g-" + Date.now(),
                            title_th: formData.title_th || "คู่มือใหม่",
                            title_mm: formData.title_mm || formData.title_th,
                            desc_th: formData.desc_th || "",
                            desc_mm: formData.desc_mm || formData.desc_th,
                            img: formData.img || "https://placehold.co/600x350/0284c7/ffffff?text=Guide",
                            steps_th: formData.steps_th || []
                        };
                        setEmpeoGuides(prev => [...prev, newG]);
                    }
                } else if (type === 'faq') {
                    if (formData.id) {
                        setFaqs(prev => prev.map(f => f.id === formData.id ? { ...f, ...formData } : f));
                    } else {
                        const newFaq = {
                            id: "f-" + Date.now(),
                            category: formData.category || "General",
                            q_th: formData.q_th || "คำถาม",
                            q_mm: formData.q_mm || formData.q_th,
                            a_th: formData.a_th || "คำตอบ",
                            a_mm: formData.a_mm || formData.a_th
                        };
                        setFaqs(prev => [...prev, newFaq]);
                    }
                } else if (type === 'benefit') {
                    const key = formData.key;
                    if (key) {
                        const { key: _k, ...restData } = formData;
                        setBenefitsData(prev => ({
                            ...prev,
                            [key]: {
                                ...prev[key],
                                ...restData
                            }
                        }));
                    }
                }

                setCrudModal({ isOpen: false, type: null, data: null, chapterId: null, sectionIndex: null });
                triggerToast(I18N[lang].toastSaved);
            };

            const handleDeleteSection = (chId, secIdx) => {
                setHandbookData(prev => prev.map(ch => {
                    if (ch.id === chId) {
                        const secs = ch.sections.filter((_, idx) => idx !== secIdx);
                        return { ...ch, sections: secs };
                    }
                    return ch;
                }));
                triggerToast(I18N[lang].toastDeleted);
            };

            const t = I18N[lang];

            return (
                <div className="flex flex-col min-h-screen">
                    <HeaderNav 
                        t={t}
                        lang={lang}
                        theme={theme}
                        role={role}
                        searchQuery={searchQuery}
                        setSearchQuery={setSearchQuery}
                        setIsSearchOpen={setIsSearchOpen}
                        toggleLang={toggleLang}
                        toggleTheme={toggleTheme}
                        onToggleRole={handleToggleRole}
                    />

                    {toastMsg && (
                        <div className="fixed bottom-5 right-5 z-50 px-4 py-2.5 bg-slate-900 text-white rounded-2xl shadow-2xl border border-sky-500/40 text-xs font-bold flex items-center space-x-2 animate-fadeIn">
                            <i className="fa-solid fa-circle-check text-sky-400"></i>
                            <span>{toastMsg}</span>
                        </div>
                    )}

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
                        <div className="flex items-center space-x-1 sm:space-x-2 bg-white dark:bg-slate-900 p-1.5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-x-auto custom-scrollbar">
                            <NavButton active={activeTab === 'home'} onClick={() => setActiveTab('home')} icon="fa-house" label={t.navHome} />
                            <NavButton active={activeTab === 'warroom'} onClick={() => setActiveTab('warroom')} icon="fa-bolt" label={t.navWarRoom} />
                            <NavButton active={activeTab === 'handbook'} onClick={() => setActiveTab('handbook')} icon="fa-book" label={t.navHandbook} />
                            <NavButton active={activeTab === 'execs'} onClick={() => setActiveTab('execs')} icon="fa-users" label={t.navExecs} />
                            <NavButton active={activeTab === 'benefits'} onClick={() => setActiveTab('benefits')} icon="fa-gift" label={t.navBenefits} />
                            <NavButton active={activeTab === 'guides'} onClick={() => setActiveTab('guides')} icon="fa-mobile-screen" label={t.navGuides} />
                            <NavButton active={activeTab === 'faq'} onClick={() => setActiveTab('faq')} icon="fa-circle-question" label={t.navFaq} />
                        </div>

                        {activeTab === 'home' && (
                            <HomeView 
                                lang={lang}
                                role={role}
                                announcements={announcements}
                                warRoomReports={warRoomReports}
                                onSelectTab={setActiveTab}
                                onSelectAnnouncement={setSelectedAnnouncement}
                                onAddNewAnnouncement={() => setCrudModal({ isOpen: true, type: 'announcement', data: null })}
                                onEditAnnouncement={(ann) => setCrudModal({ isOpen: true, type: 'announcement', data: ann })}
                                onDeleteAnnouncement={(id) => setAnnouncements(prev => prev.filter(a => a.id !== id))}
                            />
                        )}

                        {activeTab === 'warroom' && (
                            <WarRoomView 
                                lang={lang}
                                role={role}
                                reports={warRoomReports}
                                onAddNewReport={() => setCrudModal({ isOpen: true, type: 'warRoom', data: null })}
                                onEditReport={(r) => {
                                    if (r.activePillarId) {
                                        const targetPillar = r.pillars ? r.pillars.find(p => p.id === r.activePillarId) : null;
                                        setCrudModal({ isOpen: true, type: 'pillar', data: targetPillar });
                                    } else {
                                        setCrudModal({ isOpen: true, type: 'warRoom', data: r });
                                    }
                                }}
                                onDeleteReport={(id) => setWarRoomReports(prev => prev.filter(r => r.id !== id))}
                            />
                        )}

                        {activeTab === 'handbook' && (
                            <CompanyHandbookView 
                                lang={lang}
                                role={role}
                                companyInfo={companyInfo}
                                handbookData={handbookData}
                                orgLevels={orgLevels}
                                onSelectOrgLevel={setSelectedOrgLevel}
                                onEditCompany={() => setCrudModal({ isOpen: true, type: 'company', data: companyInfo })}
                                onEditChapter={(ch) => setCrudModal({ isOpen: true, type: 'chapter', data: ch })}
                                onDeleteChapter={(id) => setHandbookData(prev => prev.filter(ch => ch.id !== id))}
                                onAddNewChapter={() => setCrudModal({ isOpen: true, type: 'chapter', data: null })}
                                onEditSection={(chId, secIdx, sec) => setCrudModal({ isOpen: true, type: 'section', data: sec, chapterId: chId, sectionIndex: secIdx })}
                                onDeleteSection={handleDeleteSection}
                                onAddNewSection={(chId) => setCrudModal({ isOpen: true, type: 'section', data: null, chapterId: chId, sectionIndex: null })}
                                onSelectSection={(sec, title, chId, secIdx) => setSelectedHandbookSection({ ...sec, chapterTitle: title, chapterId: chId, secIdx: secIdx })}
                            />
                        )}

                        {activeTab === 'execs' && (
                            <ExecutivesView 
                                lang={lang}
                                role={role}
                                executives={executives}
                                hrTeam={hrTeam}
                                onSelectProfile={setSelectedProfile}
                                onEditEx={(ex) => setCrudModal({ isOpen: true, type: 'executive', data: ex })}
                                onDeleteEx={(id) => setExecutives(prev => prev.filter(e => e.id !== id))}
                                onAddNewEx={() => setCrudModal({ isOpen: true, type: 'executive', data: null })}
                                onEditHr={(hr) => setCrudModal({ isOpen: true, type: 'hr', data: hr })}
                                onDeleteHr={(id) => setHrTeam(prev => prev.filter(h => h.id !== id))}
                                onAddNewHr={() => setCrudModal({ isOpen: true, type: 'hr', data: null })}
                            />
                        )}

                        {activeTab === 'benefits' && (
                            <BenefitsView 
                                lang={lang}
                                role={role}
                                benefitsData={benefitsData}
                                onEditBenefit={(key) => setCrudModal({ isOpen: true, type: 'benefit', data: { key, ...benefitsData[key] } })}
                            />
                        )}

                        {activeTab === 'guides' && (
                            <GuidesView 
                                lang={lang}
                                role={role}
                                guides={empeoGuides}
                                onSelectGuide={setSelectedGuide}
                                onEdit={(g) => setCrudModal({ isOpen: true, type: 'empeoGuide', data: g })}
                                onDelete={(id) => setEmpeoGuides(prev => prev.filter(g => g.id !== id))}
                                onAddNew={() => setCrudModal({ isOpen: true, type: 'empeoGuide', data: null })}
                            />
                        )}

                        {activeTab === 'faq' && (
                            <FaqView 
                                lang={lang}
                                role={role}
                                faqs={faqs}
                                triggerToast={triggerToast}
                                onEdit={(f) => setCrudModal({ isOpen: true, type: 'faq', data: f })}
                                onDelete={(id) => setFaqs(prev => prev.filter(f => f.id !== id))}
                                onAddNew={() => setCrudModal({ isOpen: true, type: 'faq', data: null })}
                                feedbacks={feedbacks}
                                onAddFeedback={(text) => setFeedbacks(prev => [{ id: Date.now(), text, date: new Date().toLocaleDateString('th-TH') }, ...prev])}
                                onDeleteFeedback={(id) => setFeedbacks(prev => prev.filter(fb => fb.id !== id))}
                            />
                        )}
                    </main>

                    {selectedGuide && (
                        <GuideDetailModal
                            guide={selectedGuide}
                            onClose={() => setSelectedGuide(null)}
                            lang={lang}
                            role={role}
                            onEditGuide={(g) => setCrudModal({ isOpen: true, type: 'empeoGuide', data: g })}
                        />
                    )}

                    {selectedHandbookSection && (
                        <HandbookSectionModal
                            section={selectedHandbookSection}
                            chapterTitle={selectedHandbookSection.chapterTitle}
                            onClose={() => setSelectedHandbookSection(null)}
                            role={role}
                            onEditSection={(sec) => setCrudModal({ 
                                isOpen: true, 
                                type: 'section', 
                                data: sec, 
                                chapterId: sec.chapterId || selectedHandbookSection.chapterId, 
                                sectionIndex: sec.secIdx !== undefined ? sec.secIdx : selectedHandbookSection.secIdx 
                            })}
                        />
                    )}

                    {selectedOrgLevel && (
                        <OrgLevelDetailModal 
                            levelData={selectedOrgLevel} 
                            onClose={() => setSelectedOrgLevel(null)} 
                            role={role}
                            onUpdatePositions={handleUpdateOrgLevelPositions}
                        />
                    )}

                    {selectedProfile && (
                        <ProfileDetailModal 
                            lang={lang}
                            profile={selectedProfile}
                            onClose={() => setSelectedProfile(null)}
                        />
                    )}

                    {crudModal.isOpen && (
                        <AdminCRUDModal 
                            lang={lang}
                            type={crudModal.type}
                            data={crudModal.data}
                            chapterId={crudModal.chapterId}
                            sectionIndex={crudModal.sectionIndex}
                            onClose={() => setCrudModal({ isOpen: false, type: null, data: null, chapterId: null, sectionIndex: null })}
                            onSave={handleSaveCRUD}
                        />
                    )}

                    {showAdminPinModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn" onClick={() => setShowAdminPinModal(false)}>
                            <form onSubmit={handleVerifyAdminPin} className="bg-white dark:bg-slate-900 rounded-3xl max-w-xs w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                                <div className="text-center space-y-1">
                                    <div className="w-12 h-12 bg-amber-500/10 text-amber-500 rounded-2xl flex items-center justify-center text-xl mx-auto border border-amber-500/20">
                                        <i className="fa-solid fa-lock"></i>
                                    </div>
                                    <h3 className="font-extrabold text-base text-slate-900 dark:text-slate-100">{t.adminAuthTitle}</h3>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 font-light">กรอกรหัสผ่านเพื่อเข้าสู่โหมดแอดมิน</p>
                                </div>

                                <div className="space-y-1">
                                    <input 
                                        type="password" 
                                        value={adminPinInput}
                                        onChange={e => { setAdminPinInput(e.target.value); setAdminPinError(''); }}
                                        placeholder="กรอกรหัส 123456"
                                        className="w-full text-center tracking-widest text-lg font-bold py-2.5 px-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-slate-900 dark:text-slate-100"
                                        autoFocus
                                    />
                                    {adminPinError && (
                                        <p className="text-[11px] text-rose-500 font-bold text-center pt-0.5">{adminPinError}</p>
                                    )}
                                </div>

                                <div className="flex items-center space-x-2 pt-1">
                                    <button 
                                        type="button" 
                                        onClick={() => setShowAdminPinModal(false)}
                                        className="w-1/2 py-2 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs rounded-xl hover:bg-slate-300 dark:hover:bg-slate-700 transition"
                                    >
                                        {t.cancelBtn}
                                    </button>
                                    <button 
                                        type="submit"
                                        className="w-1/2 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow transition"
                                    >
                                        {t.submitBtn}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        window.onload = function() {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        };
    </script>
</body>
</html>
